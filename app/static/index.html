<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sumo explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/app.css?v=clear" />
  </head>
  <body>
    <aside>
      <header>
        <p class="eyebrow">Read only</p>
        <h1>Sumo explorer</h1>
        <p class="meta" id="region">loading…</p>
        <button type="button" id="refresh">Refresh from Sumo</button>
        <button type="button" id="generate">Generate Terraform</button>
        <button type="button" id="clear-selection">Clear selection</button>
        <p class="meta select-meta" id="select-count">0 selected</p>
        <input id="filter" type="search" placeholder="Search services or resources" autocomplete="off" />
      </header>
      <nav id="tree"></nav>
    </aside>
    <main>
      <div class="pane-head">
        <div>
          <p class="eyebrow" id="kind-label">Account</p>
          <h2 id="object-title">Select a resource</h2>
        </div>
      </div>
      <p class="query" id="query"></p>
      <pre id="json">Check resources in the left nav, then generate Terraform. Properties appear here as JSON after you click a resource.</pre>
    </main>
    <script src="/static/app.js?v=clear"></script>
  </body>
</html>
